name: Deploy Athena to osiris

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: autorole-osiris
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: deploy
    if: forgejo.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check project
        run: bun run check

      - name: Compile standalone executable
        run: bun run build:binary

      - name: Check restricted receiver
        run: |
          command -v python3 >/dev/null || { apt-get update -qq; apt-get install -y -qq python3; }
          python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Install verified Tailscale and SSH client
        run: |
          command -v ssh >/dev/null || { apt-get update -qq; apt-get install -y -qq openssh-client; }
          bash deploy/install-tailscale.sh
      - name: Deploy and wait for Discord readiness
        env:
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.ATHENA_DEPLOY_SSH_KEY }}
          FORGEJO_RUN_ID: ${{ forgejo.run_id }}
          FORGEJO_RUN_ATTEMPT: ${{ forgejo.run_attempt }}
        run: bash scripts/deploy-artifact.sh
