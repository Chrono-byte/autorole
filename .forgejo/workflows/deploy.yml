name: Deploy Athena to hermes

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: autorole-hermes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ci
    if: forgejo.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check project
        run: bun run check

      - name: Compile standalone executable
        run: bun run build:binary

      - name: Deploy and wait for Discord readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          command -v ssh >/dev/null
          command -v scp >/dev/null
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add -
          unset DEPLOY_SSH_KEY
          bun run deploy:artifact "$DEPLOY_HOST"
